name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -m compileall skills tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Test owned browser lifecycle example
        run: node --test examples/owned-browser-lifecycle/with-owned-browser.test.cjs
      - name: Smoke-test live JSON probe
        timeout-minutes: 1
        run: >-
          python skills/resource-safe-execution/scripts/resource_probe.py
          --format json --sample-seconds 0.1 |
          python -c "import json, sys; payload = json.load(sys.stdin);
          assert payload.get('schema_version') == '1.0'"
      - name: Validate canonical skill
        run: python tests/validate_skill.py skills/resource-safe-execution
